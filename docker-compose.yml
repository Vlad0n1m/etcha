services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: etcha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-etcha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etcha_secret}
      POSTGRES_DB: ${POSTGRES_DB:-etcha}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-etcha} -d ${POSTGRES_DB:-etcha}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - etcha-network

  # ============================================
  # Next.js Application
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SOLANA_RPC_URL=${NEXT_PUBLIC_SOLANA_RPC_URL:-https://api.devnet.solana.com}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://etcha.app}
    container_name: etcha-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-etcha}:${POSTGRES_PASSWORD:-etcha_secret}@postgres:5432/${POSTGRES_DB:-etcha}
      
      # Auth.js
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AUTH_TWITTER_ID: ${AUTH_TWITTER_ID:-}
      AUTH_TWITTER_SECRET: ${AUTH_TWITTER_SECRET:-}
      
      # Legacy NextAuth (if needed)
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://etcha.app}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-${AUTH_SECRET}}
      
      # Solana
      SOLANA_NETWORK: ${SOLANA_NETWORK:-devnet}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      NEXT_PUBLIC_SOLANA_RPC_URL: ${NEXT_PUBLIC_SOLANA_RPC_URL:-https://api.devnet.solana.com}
      PLATFORM_WALLET_PRIVATE_KEY: ${PLATFORM_WALLET_PRIVATE_KEY}
      SOLANA_PRIVATE_KEY: ${SOLANA_PRIVATE_KEY}
      
      # Application
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://etcha.app}
      JWT_SECRET: ${JWT_SECRET}
      DERIVATION_SALT: ${DERIVATION_SALT:-etcha-platform-salt}
      
      # Cloudinary
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      
      # cNFT Configuration
      ENABLE_CNFT: ${ENABLE_CNFT:-true}
      DEFAULT_NFT_TYPE: ${DEFAULT_NFT_TYPE:-cnft}
      HELIUS_RPC_URL: ${HELIUS_RPC_URL:-}
      DAS_API_URL: ${DAS_API_URL:-}
      
      # Node
      NODE_ENV: production
    expose:
      - "3000"
    networks:
      - etcha-network

  # ============================================
  # Nginx Reverse Proxy
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: etcha-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - etcha-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # Certbot for SSL certificates
  # ============================================
  certbot:
    image: certbot/certbot
    container_name: etcha-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - etcha-network
    profiles:
      - ssl

  # ============================================
  # Database Migrations (one-time job)
  # ============================================
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: etcha-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-etcha}:${POSTGRES_PASSWORD:-etcha_secret}@postgres:5432/${POSTGRES_DB:-etcha}
    command: npx prisma@6 migrate deploy
    networks:
      - etcha-network
    profiles:
      - migrate

volumes:
  postgres_data:
    driver: local

networks:
  etcha-network:
    driver: bridge
