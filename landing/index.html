    <title>Etcha | Solana Ticketing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Outfit', 'sans-serif'],
            },
            colors: {
              etcha: {
                bg: '#000000',
                card: '#141414',
                accent: '#9945FF', // Solana Purple
                green: '#14F195', // Solana Green
                text: '#f2f2f2',
                subtext: '#9ca3af',
              }
            },
            backgroundImage: {
              'solana-gradient': 'linear-gradient(90deg, #9945FF 0%, #14F195 100%)',
              'solana-text': 'linear-gradient(90deg, #9945FF 0%, #14F195 100%)',
              'card-gradient': 'linear-gradient(180deg, rgba(20, 20, 20, 0.9) 0%, rgba(10, 10, 10, 0.95) 100%)',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #000000;
        color: white;
        overflow-x: hidden;
      }
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #000000;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 3px;
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .neon-border {
        box-shadow: 0 0 10px rgba(20, 241, 149, 0.2), inset 0 0 20px rgba(153, 69, 255, 0.1);
      }
    </style>
